{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body"><div class="text-center mb-4"><div class="action-icon mx-auto mb-3"><i class="bi bi-person-plus" aria-hidden="true"></i></div><h1 class="h2 fw-bold">Join LifeLink</h1><p class="text-muted mb-0">Create an account and help your community.</p></div><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="username">Username</label><input type="text" id="username" name="username" class="form-control" autocomplete="username" required></div><div class="mb-3"><label class="form-label" for="email">Email address</label><input type="email" id="email" name="email" class="form-control" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input type="password" id="password" name="password" class="form-control" autocomplete="new-password" required></div><div class="mb-4"><label class="form-label" for="confirmPassword">Confirm password</label><input type="password" id="confirmPassword" name="confirm_password" class="form-control" autocomplete="new-password" required></div><button type="submit" class="btn btn-success w-100">Create account</button></form><p class="text-center text-muted small mt-4 mb-0">Already registered? <a href="/login" class="fw-bold text-danger">Log in</a></p></div></div>
{% endblock %}
