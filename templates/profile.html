{% extends "base.html" %}

{% block title %}
Profile
{% endblock %}

{% block content %}

<div class="card shadow">

    <div class="card-body">

        <h2>User Profile</h2>

        <hr>

        <p>
            <strong>Username:</strong>
            {{ user.username }}
        </p>

        <p>
            <strong>Email:</strong>
            {{ user.email }}
        </p>

        <p>
            <strong>Role:</strong>
            {{ user.role }}
        </p>

        <p>
            <strong>Created At:</strong>
            {{ user.created_at }}
        </p>

    </div>

</div>

{% endblock %}
