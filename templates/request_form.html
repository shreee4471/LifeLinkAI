{% extends "base.html" %}
{% block title %}{{ form_title }}{% endblock %}
{% block content %}
<div class="page-heading mb-4"><div class="eyebrow">Make a difference</div><h1 class="h2 fw-bold mb-1">{{ form_title }}</h1><p class="text-muted mb-0">Share the details so nearby donors can respond.</p></div><div class="card"><div class="card-body"><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-6"><label class="form-label" for="blood_group_needed">Blood group needed</label><select id="blood_group_needed" name="blood_group_needed" class="form-select" required><option value="">Select blood group</option>{% for group in blood_groups %}<option value="{{ group }}">{{ group }}</option>{% endfor %}</select></div><div class="col-md-6"><label class="form-label" for="units_required">Units required</label><input type="number" id="units_required" name="units_required" class="form-control" min="1" required></div><div class="col-md-6"><label class="form-label" for="city">City</label><input type="text" id="city" name="city" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="hospital_name">Hospital name</label><input type="text" id="hospital_name" name="hospital_name" class="form-control" required></div><div class="col-md-6"><label class="form-label" for="urgency">Urgency</label><select id="urgency" name="urgency" class="form-select" required><option value="">Select urgency</option>{% for urgency in urgency_levels %}<option value="{{ urgency }}">{{ urgency }}</option>{% endfor %}</select></div></div><div class="d-flex flex-wrap gap-2 mt-4"><button type="submit" class="btn btn-danger">Create request</button><a href="{{ url_for('request.list_requests') }}" class="btn btn-outline-secondary">Cancel</a></div></form></div></div>
{% endblock %}
