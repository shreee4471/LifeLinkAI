{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="card auth-card"><div class="card-body"><div class="text-center mb-4"><div class="action-icon mx-auto mb-3"><i class="bi bi-droplet-half" aria-hidden="true"></i></div><h1 class="h2 fw-bold">Welcome back</h1><p class="text-muted mb-0">Sign in to continue your impact.</p></div><form method="POST"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="mb-3"><label class="form-label" for="loginEmail">Email address</label><input type="email" id="loginEmail" name="email" class="form-control" autocomplete="email" required></div><div class="mb-4"><label class="form-label" for="loginPassword">Password</label><div class="input-group"><input type="password" id="loginPassword" name="password" class="form-control" autocomplete="current-password" required><button type="button" class="btn btn-outline-secondary" onclick="toggleLoginPassword()" aria-label="Show password"><i id="eyeIcon" class="bi bi-eye" aria-hidden="true"></i></button></div></div><button type="submit" class="btn btn-danger w-100">Log in</button></form><p class="text-center text-muted small mt-4 mb-0">New to LifeLink? <a href="/register" class="fw-bold text-danger">Create an account</a></p></div></div>
{% endblock %}
