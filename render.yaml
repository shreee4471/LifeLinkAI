services:
  - type: web
    name: lifelink-ai
    runtime: docker
    plan: free
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: LIFELINK_DATABASE
        value: /app/database/login_auth.db
      - key: COOKIE_SECURE
        value: "1"
    # Free-plan note: the SQLite database lives in the container filesystem,
    # so it resets when the service is redeployed. To keep data across
    # redeploys, switch plan to "starter" and use a persistent disk instead:
    #   plan: starter
    #   disk:
    #     name: lifelink-data
    #     mountPath: /data
    #     sizeGB: 1
    # ...and set LIFELINK_DATABASE to /data/login_auth.db
